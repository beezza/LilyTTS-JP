[project]
name = "lilytts-jp"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
audio = ["soundfile"]
text = ["pyopenjtalk-plus[onnxruntime]"]
train = ["torch", "torchaudio", "transformers", "soundfile"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["lilytts*", "data_pipeline*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"lilytts.labeler" = ["data/*.tsv"]
